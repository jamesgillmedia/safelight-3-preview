<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>mini oz</title>
<link rel="stylesheet" href="css/kit.css?v=1120-k2">
<link rel="stylesheet" href="css/kids.css?v=1120-k2">
</head>
<body>
<canvas id="grid" aria-hidden="true"></canvas>
<div id="anchor"><div class="clk"></div><div class="dt lbl"></div><div class="ln" id="modeLine"></div></div>
<div id="home" class="con" aria-label="home"></div>
<div id="dial" aria-label="dial"><svg id="dialArc" viewBox="0 0 320 120" aria-hidden="true"></svg><div id="stops"></div></div>
<button id="moon" aria-label="grown-ups: hold the moon"><svg viewBox="-40 -40 80 80" aria-hidden="true"><defs><radialGradient id="mh"><stop offset="0" stop-color="currentColor" stop-opacity=".28"/><stop offset=".45" stop-color="currentColor" stop-opacity=".08"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></radialGradient><mask id="mm"><rect x="-40" y="-40" width="80" height="80" fill="#000"/><circle r="11" fill="#fff"/><circle cx="-4.6" cy="-2.4" r="10.6" fill="#000"/></mask></defs><circle r="30" fill="url(#mh)"/><circle r="11" fill="currentColor" mask="url(#mm)"/></svg><i class="hold"></i></button>

<div id="room" class="layer"><div class="rt lbl" id="rT"></div><div class="rb" id="rB"></div></div>
<div id="mw" class="layer"><canvas></canvas><div class="mwn lbl">moonwater · lost in time</div><div class="mwbar"><button data-m="15">15 min</button><button data-m="30" class="on">30 min</button><button data-m="0">keep on</button></div></div>

<div id="watch" class="layer"><div class="wface"><div id="wpages"></div><div id="wdots"></div></div><p class="lbl wnote">watch · swipe or tap the dots</p></div>

<button id="corner" aria-label="oz · back"><span class="bk">&#8249;</span><span class="oc"></span><span>oz</span></button>
<div id="mid" class="lbl" role="group" aria-label="preview"><button data-band="little">6–9</button><button data-band="older">10–13</button><button data-band="teen">14–17</button><button data-watch="1">watch</button></div>
<button id="disc" aria-label="red mode"><i></i></button>
<div id="toast" aria-live="polite"></div>
<script src="js/kit.js?v=1120-k2"></script>
<script src="js/kids.js?v=1120-k2"></script>
</body>
</html>
