<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#04070b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>oz</title>
  <link rel="stylesheet" href="css/room.css">
</head>
<body>
  <canvas id="env" aria-hidden="true"></canvas>
  <div id="redveil" aria-hidden="true"></div>
  <audio id="bed" playsinline webkit-playsinline preload="auto"></audio>
  <button id="disc" type="button" aria-label="red mode"><i></i></button>
  <div id="dimmer" role="slider" aria-label="dimmer" aria-valuemin="8" aria-valuemax="100" aria-valuenow="100" tabindex="0">
    <i class="dm-rail"><i class="dm-track"></i><i class="dm-fill"></i><i class="dm-knob"></i></i>
    <span class="dm-v"></span>
  </div>
  <i id="backhint" aria-hidden="true">‹</i>
  <p id="name" class="jul" aria-live="polite"></p>
  <p id="wake">tap to hear</p>
  <i id="heard" aria-hidden="true"></i>
  <button id="exbtn" type="button" aria-label="extras">extras</button>
  <div id="extras" hidden>
    <div class="ex-row" data-k="dial"><span>dial</span><em>off</em></div>
    <div class="ex-row" data-k="orb"><span>3d dial</span><em>off</em></div>
    <div class="ex-row" data-k="tune"><span>tune</span><em>off</em></div>
    <div class="ex-row" data-k="pause"><span>pause</span><em>off</em></div>
    <div class="ex-row" data-k="touch"><span>touch</span><em>off</em></div>
    <div class="ex-row" data-k="reflect"><span>reflections</span><em>off</em></div>
    <div class="ex-row" data-k="moon"><span>moon</span><em>off</em></div>
  </div>
  <button id="envdot" type="button" aria-label="environment" hidden><i></i></button>
  <div id="envdial" hidden>
    <canvas id="envring" aria-hidden="true"></canvas>
  </div>
  <div id="envsheet" hidden>
    <div class="env-row" data-k="light"><span>light</span><i class="tune-rail" role="slider" aria-label="light"><i class="tune-track"></i><i class="tune-fill"></i><i class="tune-knob"></i></i><em></em></div>
    <div class="env-row" data-k="warmth"><span>warmth</span><i class="tune-rail" role="slider" aria-label="warmth"><i class="tune-track"></i><i class="tune-fill"></i><i class="tune-knob"></i></i><em></em></div>
    <div class="env-row" data-k="glow"><span>glow</span><i class="tune-rail" role="slider" aria-label="glow"><i class="tune-track"></i><i class="tune-fill"></i><i class="tune-knob"></i></i><em></em></div>
    <div class="env-row" data-k="wind"><span>wind</span><i class="tune-rail" role="slider" aria-label="wind"><i class="tune-track"></i><i class="tune-fill"></i><i class="tune-knob"></i></i><em></em></div>
    <div class="env-row" data-k="density"><span>density</span><i class="tune-rail" role="slider" aria-label="density"><i class="tune-track"></i><i class="tune-fill"></i><i class="tune-knob"></i></i><em></em></div>
    <div class="env-row" data-k="height"><span>height</span><i class="tune-rail" role="slider" aria-label="height"><i class="tune-track"></i><i class="tune-fill"></i><i class="tune-knob"></i></i><em></em></div>
    <div class="env-row env-toggle" data-k="tilt"><span>tilt</span><em>off</em></div>
  </div>
  <i id="pause" aria-hidden="true"><b></b><b></b></i>
  <div id="tune" hidden>
    <div class="tune-row" data-k="vol"><span>volume</span><i class="tune-rail" role="slider" aria-label="volume"><i class="tune-track"></i><i class="tune-fill"></i><i class="tune-knob"></i></i><em></em></div>
    <div class="tune-row" data-k="white"><span>air</span><i class="tune-rail" role="slider" aria-label="air"><i class="tune-track"></i><i class="tune-fill"></i><i class="tune-knob"></i></i><em></em></div>
    <div class="tune-row" data-k="pink"><span>grain</span><i class="tune-rail" role="slider" aria-label="grain"><i class="tune-track"></i><i class="tune-fill"></i><i class="tune-knob"></i></i><em></em></div>
    <div class="tune-row" data-k="brown"><span>deep</span><i class="tune-rail" role="slider" aria-label="deep"><i class="tune-track"></i><i class="tune-fill"></i><i class="tune-knob"></i></i><em></em></div>
    <div class="tune-timer">
      <span>fade</span>
      <button type="button" data-m="15">15</button>
      <button type="button" data-m="30">30</button>
      <button type="button" data-m="60">60</button>
      <button type="button" data-m="0">off</button>
    </div>
  </div>
  <div id="dots" aria-hidden="true"></div>
  <div id="inten" aria-hidden="true"><i></i></div>
  <div id="sleep" hidden>
    <button type="button" data-m="15">15</button>
    <button type="button" data-m="30">30</button>
    <button type="button" data-m="60">60</button>
    <button type="button" data-m="0">off</button>
  </div>
  <p id="left"></p>
  <script src="js/room.js"></script>
</body>
</html>
