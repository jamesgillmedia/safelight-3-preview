<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#04070b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>mini oz</title>
  <link rel="stylesheet" href="css/kids.css?v=1120-k1">
</head>
<body class="little">
  <div id="proto" role="group" aria-label="preview">
    <span class="pl">preview</span>
    <button data-band="little" class="on">6–9</button>
    <button data-band="older">10–13</button>
    <button data-watch="1">watch</button>
  </div>

  <main id="phone">
    <header id="top">
      <p id="clock" class="jul">7:40</p>
      <p id="greet">good evening</p>
      <button id="moon" aria-label="grown-ups: hold the moon"><svg viewBox="0 0 40 40"><path d="M26 6a15 15 0 1 0 8 26A13 13 0 0 1 26 6z"/></svg></button>
    </header>
    <section id="con" aria-label="home">
      <svg id="lines" aria-hidden="true"></svg>
    </section>
    <p id="modeLine"></p>
    <div id="dial" aria-label="dial">
      <svg id="dialArc" viewBox="0 0 320 150" aria-hidden="true"></svg>
      <div id="stops"></div>
    </div>
    <button id="red" aria-label="red mode"><i></i></button>
  </main>

  <section id="sheet" hidden>
    <button id="home" aria-label="home">&#8249; home</button>
    <h2 id="sheetTitle" class="jul"></h2>
    <div id="sheetBody"></div>
  </section>

  <section id="watch" hidden aria-label="watch">
    <div class="band"></div>
    <div class="face">
      <div id="wpages"></div>
      <div id="wdots"></div>
    </div>
    <div class="band b2"></div>
    <p class="wnote">watch-sized · swipe or tap the dots</p>
  </section>

  <div id="toast" aria-live="polite"></div>
  <script src="js/kids.js?v=1120-k1"></script>
</body>
</html>
