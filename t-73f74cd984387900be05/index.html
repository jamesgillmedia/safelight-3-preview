<!doctype html>
<html lang="en" data-opt="a" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#04070b">
<title>Work examples · Permanent Impermanence · Gill James</title>
<link rel="stylesheet" href="css/lab.css">
<link rel="stylesheet" href="css/cks.css">
<link rel="stylesheet" href="css/tune.css">
<script src="js/tune.js"></script>
</head>
<body>
<header class="lab-top">
  <button type="button" class="lab-btn ic" id="back" hidden aria-label="back">‹</button>
  <span class="sig" lang="cr" aria-label="Gill James">ᑕᐣᓯ</span>
  <span class="crumb ju" id="crumb"><b>work examples · </b><span id="where">Permanent Impermanence</span></span>
  <button type="button" class="lab-btn" id="sheetBtn" aria-pressed="false">works</button>
  <a class="lab-btn" id="cvBtn" href="cv/gill-james-arts-cv.pdf" target="_blank" rel="noopener">CV</a>
</header>

<main class="view on sky" id="sky" aria-label="constellation of work examples">
  <div class="starfield" id="starfield" aria-hidden="true"></div>
  <div class="constel" id="constel"></div>
</main>

<section class="view" id="sheet" aria-label="all works">
  <div class="sheet-sc">
    <div class="proof">
      <div class="phd"><span class="ju" id="phd">work examples</span><span>Permanent Impermanence</span></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
</section>

<section class="view work" id="work" aria-label="one work">
  <div class="stage" id="stage"></div>
  <div class="dock">
    <div class="work-id">
      <h1 class="ju" id="workName"></h1>
      <p class="line" id="workLine"></p>
    </div>
    <div class="types" id="types" hidden></div>
    <div class="nav-row">
      <button type="button" class="lab-btn ic" id="prev" hidden aria-label="previous">‹</button>
      <span class="count ju" id="count"></span>
      <button type="button" class="lab-btn ic" id="next" hidden aria-label="next">›</button>
    </div>
    <p class="cap" id="cap"></p>
    <div class="rail" id="rail" hidden></div>
  </div>
</section>

<p class="lab-hint" id="hint">tap a star</p>

<aside id="tune" class="tune">
  <div class="tune-bar" role="tablist" aria-label="design options">
    <div class="tune-opts" id="tuneOpts"></div>
    <button type="button" class="lab-btn" id="tuneOpen" aria-expanded="false">tune</button>
  </div>
  <div class="tune-panel" id="tunePanel" hidden>
    <p class="tune-why" id="tuneWhy">A is the default: it's the first version, with more photographs of each piece.</p>
    <div class="tune-keep" id="tuneKeep"></div>
    <div class="tune-hidden" id="tuneHidden" hidden></div>
    <label class="tune-row">Photo size <input type="range" id="tPhoto" min="70" max="115" value="100"></label>
    <label class="tune-row">Spacing <input type="range" id="tSpace" min="60" max="160" value="100"></label>
    <label class="tune-row">Text size <input type="range" id="tType" min="85" max="125" value="100"></label>
    <label class="tune-row">Motion <input type="range" id="tMotion" min="0" max="100" value="100"><span class="tune-note" id="tMotionNote">full</span></label>
    <div class="tune-row tune-themes">
      <span>Colour</span>
      <div class="tune-theme-btns" id="tuneTheme">
        <button type="button" class="lab-btn" data-theme="night">night</button>
        <button type="button" class="lab-btn" data-theme="red">red</button>
        <button type="button" class="lab-btn" data-theme="full">full red</button>
      </div>
    </div>
  </div>
</aside>

<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
