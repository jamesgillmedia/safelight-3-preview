<script>
var SECS=[{"id": "s1", "n": "1", "title": "Project title", "limit": 80, "text": "Permanent Impermanence"}, {"id": "s2", "n": "2", "title": "Project summary", "limit": 255, "text": "Public art as infrastructure, integrated into places people belong and live next to. Seats, edges, light and plants, rooted in culture. Wood shaped by hand. A space for projects to exist, activated or left to rest. Someone sits. Then someone else."}, {"id": "s3", "n": "3", "title": "Describe your project", "limit": 4000, "text": "I am Gill\nI am James\nI am an artist\na Cree voice rising\n\nI'm a Cree-Métis and Two-Spirit (he/him) visual artist and maker. Making what you need with your own hands is how my grandfather found his way back to who he was and who he'd left behind. It's how I carry it.\n\nPicture an evening in Vancouver at dusk. One light, concrete, and nobody stops. Come back later. The same light falls on wood shaped by hand and on plants that belong here. A weaving path, a lush understory, a tree canopy misted in the winter rain. The glow of a nearby café's windows. A covered area stepped back like an amphitheatre, room for your gaze to rise. Someone sits. Then someone else.\n\nThis bustling scene I’ve created for you is rooted in community, using existing public infrastructure with art centred as infrastructure.\n\nWhen the installation is finished it should feel like it was always there, but be a space people want to spend time in. A hub, a gathering place, a space for projects to exist. It can be activated or left to rest.\n\nI make infrastructure as art, through an ethnobotanical lens. Seats, edges, light and plants, all rooted in culture and made for people. The art has a job in the space, like the lighting does, and it's still art.\n\nI add \"invisible\" elements too. By this I mean light, framing and composition elements in 3D space, the things that affect how folks feel and pull on the subconscious. Planes, depth and forced perspective in physical space guide the human experience.\n\nEssential infrastructure imagined as art, and the basic human need for light and nature.\n\nIt's more than a stage, a whole space you enter, transformed yet integrated. It considers both the seer and the seen. The audience gets places to settle, at different heights.\n\nThe living part is art too. It can sit inside what's already growing, or become a new forest garden, made for what it will be in 100, 300 and 1,000 years. Existing public space that, through my treatment, becomes a space to be. The Host Nations and plant knowledge keepers guide what grows here. Learning from them is an essential part of the work.\n\nI'm looking for an underused spot in Vancouver, on City or Park Board land, with good bones. Public art as infrastructure integrated into places people belong and live next to. Some light already there, natural levels, a place to sit and watch. Perhaps existing concrete foundations, or a natural setting at street level that's underused. I'll respect what's there and leave it improved, not overpowered. A waterfront site is my backup. The work runs April 2027 to January 2028.\n\nThe form stays open, evolving. The site and the process decide. My vision, philosophy and guiding principles hold the whole way through.\n\nPermanent impermanence\n\nActivations are repeatable, but what's left behind is improved public space that already exists.\n\nThe making:\n- Find the site and sort out permissions with the City or Park Board, and insurance.\n- Study the light there, day and night.\n- Plan the planting with the Host Nations and plant knowledge keepers.\n- Mill my own yellow cedar and make test pieces.\n- Build and install. A licensed electrician does any wiring.\n- A hired videographer documents the key stages and the opening.\n- Open it with one free gathering in the space, with live music, open to anyone.\n\nI have my tools and a workspace, and may need access to wood and fab shops. The grant pays for the artwork itself: its materials (cedar, plants and light), my time making it, the people who help make, guide and document it, and presenting it.\n\nBy the end there's at least one finished piece in place, and the whole process documented."}, {"id": "s4", "n": "4", "title": "Why this project, and why now (Relevance)", "limit": 2500, "text": "My grandfather, Jack Taylor, was taken as a child from his family's home in Norway House Cree Nation, Kinosao Sipi. His father's family was Cree, from Norway House, and his mother's family was Red River Métis. They lived traditionally, in a teepee along the road allowance. Seeing what was coming, his mother made the decision to hide they were \"Indian\" so they could pass as white, and that carried a deep shame. Jack found his way back to who he was through art. After he retired from the police force, he went to art school and became a fine artist. He worked in pencil and graphite, watercolour and collage, and made masks that looked almost like carved wood. He invented and built many of his own tools, and he often photographed a scene before he painted it.\n\nI was very close to him, and I spent a lot of time in his studio. That's where I learned that making things with your hands can be a way of holding on to who you are. Our family never went back to Norway House or Red River, and I won't claim a closeness to community I haven't earned. But I've always felt that something of it stayed with us. My connection with him was deep, and I am grateful to have been with him in his years of reflection, and to carry on our family's artistry. I'm a status member of Norway House Cree Nation.\n\nSome of his work is still here. This project picks up a thread he left me. His masks reached toward carved wood, and I shape the wood itself, milled by my own hand. He worked from photographs, and I work through a camera. He made his own tools, and my objects are themselves often tools. I build and keep trails by hand, in all weather, close to the plants and the ground.\n\nWhy now: the basic human need for light and nature. A single light shining warmth onto the concrete below, a lush understory framed by mature cedars, a place where community happens. Underused places with good bones are here now, and so is the cedar I've milled. The living part is made for what it will be in 100, 300 and 1,000 years, and it has to start somewhere. This work is how I carry his line forward, and how I take the step he never got to take: going back to Norway House, if I'm welcomed.\n\nAll my relations,\nin all my creations\ntheir breath in every chord I make and everything\nI create."}, {"id": "s5", "n": "5", "title": "Impact", "limit": 2000, "text": "Fine art and music\nare rivers I swim, a daily drift\na lifelong hum\n\nI've worked in light, space, objects, sound and film most of my life. This work brings all of it into one place, at full scale, in public. It's not a picture on a wall.\n\nWhen it's done there's a finished, documented place-work. A space for projects to exist, activated or left to rest. It opens with one free gathering in the space, with live music, open to anyone. What stays behind? Human-centred art as infrastructure, an ecosystem where gathering is possible.\n\nThis builds on work already recognized. My public art concept Spirit Eye of skwácháýs, co-created with Joshua Ngenda, received Best Public Art Concept and Council's Choice in the BIDC Public Art Intensive.\n\nIt's for whoever walks by, and for the Indigenous community here. A corner of the city people walked past becomes somewhere they stop, sit and come back to. A free place to gather, to stay. What I learn from the plant knowledge keepers stays in my practice, in every place I make after this. The living part keeps growing long after the grant ends. Someone sits. Then someone else."}, {"id": "s6", "n": "6", "title": "Capacity and experience (Feasibility)", "limit": 2500, "text": "I am an artist.\n\nMy work lives in light, framing and composition in 3D space, and how they affect the way folks feel and pull on the subconscious. I carry that into wood, sound, plants and the places I make. My artful eye and practical nature fuse art, natural materials and function. I'm hands on, I finish what I make, and I make big ideas happen.\n\nWhat I bring:\n- Public art: Spirit Eye of skwácháýs, co-created with Joshua Ngenda in the BIDC Public Art Intensive (June 2025), recognized with Best Public Art Concept and Council's Choice.\n- Wood: I mill my own yellow cedar and design and carve wooden pieces, including hand-carved paddles, with my own gouges and power carving tools.\n- Land: I build and keep trails on my own time, by hand, in all weather. Trail stewardship keeps me close to the plants and the ground I'll be working with.\n- Sound: I write and record my own music.\n- Light and image: the Leo Award for Best Cinematography in a Short Drama and a CSC Cinematography Award, both for One With the Devil (2015). Co-director with Jett Pace, cinematographer and producer on Old Man Canyon's \"Back to the Start\".\n- Teaching: as an Adjunct Professor at UBC, I designed and taught the Advanced Cinematography course.\n- Education: BFA (Honours) in Film Production, Cinematography, UBC (2014), Advertising at OCAD (2011), and Theatre Production Design at Toronto Metropolitan University.\n\nI've run large, complex projects for over a decade, with crews, budgets and tight timelines. My principles come from years of building. Start simple and familiar. Keep it quiet, local and human. Respect the original. Make it feel like it was always there. I enjoy self directed creation, and this project is sized for one maker, with a paid helper for safety on heavy lifts and a licensed electrician for wiring."}, {"id": "s7", "n": "7", "title": "Traditional knowledge and cultural protocols (pass/fail)", "limit": null, "text": "This work comes from my own practice and my own family. I'm a status member of Norway House Cree Nation, and my family is also Red River Métis. I'm Cree-Métis, a guest on the lands of the xʷməθkʷəy̓əm (Musqueam), Sḵwx̱wú7mesh (Squamish) and səlilwətaɬ (Tsleil-Waututh) Nations, and I hold gratitude and deep respect for the land and its ancestral caretakers. I won't use ceremony, crests, forms or stories I haven't been given the right to use.\n\nPlants carry knowledge. Before anything is planted I'll go to the Host Nations and plant knowledge keepers, ask first, and follow their lead on what grows here and how. They're paid honoraria, and named only if they agree.\n\nThe story of my grandfather, Jack Taylor, is my family's to tell, and I tell it with care. Any step toward Norway House Cree Nation follows the Nation's own process, and only if I'm welcomed."}, {"id": "s8", "n": "8", "title": "Timeline / activity dates", "limit": null, "text": "1 April 2027 to 31 January 2028 (10 months)\n\nApr to Jun 2027: find the site, on City or Park Board land. Underused plazas, park edges and lit corners of the city with good bones. Study the light there, day and night. Mill my own yellow cedar and make test pieces. Start the planting plan with the Host Nations and plant knowledge keepers.\n\nJul to Aug 2027: confirm the site, permissions with the City or Park Board, and insurance. If permission isn't in place by the end of August, I move to the backup site. Make the pieces and line up the plants.\n\nSep to Oct 2027: build and install. A paid helper on heavy days, and a licensed electrician for any wiring. A videographer documents the key stages.\n\nNov 2027: the opening. One free gathering in the space, with live music, open to anyone. A videographer documents it. After that it's a space for projects to exist, activated or left to rest.\n\nDec 2027 to Jan 2028: finish the documentation and the final report. Hand care of the living part to whoever looks after the site, so it keeps growing."}, {"id": "s9", "n": "9", "title": "Key participants / collaborators", "limit": null, "text": "I'm making this on my own.\n\n- A helper, paid, for safety on heavy lifts. I'll look first for an Indigenous maker.\n- A licensed electrician, paid, for any wiring.\n- A videographer, paid a day rate, to document the key stages and the opening.\n- Host Nation and plant knowledge keepers, paid honoraria, guiding the living part. Named only if they agree."}, {"id": "s10", "n": "10", "title": "Budget (portal budget form)", "limit": null, "text": "Budget: 1 April 2027 to 31 January 2028 (all CAD). Every line is for making, installing, documenting or presenting the artwork.\n\nArtist fees (me)\n- Research, site and light study, design of the artwork: 60 h x $70: $4,200.00\n- Making the artwork: milling, carving, test pieces, planting plan: 300 h x $70: $21,000.00\n- Installing the artwork: 8 days x $557: $4,456.00\n- Presenting the work: opening gathering with live music, 1 x $757: $757.00\n- Planning and final report: $400.00\n- Subtotal: $30,813.00\n\nArtwork materials\n- Yellow cedar for the artwork (4 slabs, 40 2x8, 30 decking): $3,843.90\n- Finish and fixings for the artwork: $1,000.00\n- Plants for the living part of the artwork, 120 x 2-gal pots at $25: $3,000.00\n- Planting medium for the living part of the artwork: $800.00\n- Light for the artwork: 10 outdoor-rated LED fixtures at $240: $2,400.00\n- Light for the artwork: cable, driver, timer, mounts: $650.00\n- Light studies: mockup materials: $600.00\n- Subtotal: $12,293.90\n\nPeople\n- Licensed electrician and electrical permit for the artwork's light: $1,130.00\n- Helper for safety on heavy lifts, 48 h x $28.55: $1,370.40\n- Helper WorkSafeBC coverage: $150.00\n- Plant knowledge keeper honoraria, 6 sessions x $500: $3,000.00\n- Gifts for knowledge keepers, 6 x $50: $300.00\n- Opening welcome by a Host Nation Elder, if invited and agreed: $475.00\n- Videographer documenting the work, 3 half days x $1,100: $3,300.00\n- Videographer documenting the work, 2 full days x $1,400: $2,800.00\n- Edit of the documentation: $1,000.00\n- Subtotal: $13,525.40\n\nInstalling and presenting the artwork\n- Liability insurance while installing and presenting the artwork, $2M: $1,000.00\n- Permits to install and present the artwork (City or Park Board): $2,126.00\n- Shop access to make the larger pieces, 2 months x $1,000 + $190 membership: $2,190.00\n- Transport of the artwork to site: $300.00\n- Local mileage, 400 km x $0.73: $292.00\n- Sound for the opening gathering: $750.00\n- Accessibility for the opening gathering: $600.00\n- Subtotal: $7,258.00\n\nSubtotal, all lines: $63,890.30\nTax (12% on materials and goods, 5% GST on shop and permits): $1,817.07\nContingency (5%): $3,285.37\nTotal project cost: $68,992.74\n\nIn-kind (mine, not requested)\n- Yellow cedar I've already milled (estimate): $1,500.00\n- My workspace, 10 months: $2,000.00\n- My carving tools and milling gear: $1,000.00\n- Total in-kind: $4,500.00\n\nOther revenue\n- None: $0. This is the only funding so far.\n\nTotal request to Canada Council: $68,992.74"}, {"id": "s11", "n": "11", "title": "Support material and checklist", "limit": null, "text": "☐ Artist bio\n☐ Work samples with short descriptions\n☐ Bios of key participants, if named\n☐ Letters or confirmations, where they apply\n\nBefore you submit\n☐ Check each answer's limit in the portal Preview\n☐ Budget total $68,992.74 · in-kind $4,500 · other revenue $0\n☐ Artist profile validated\n☐ Paste as plain text and check the special characters came through\n☐ Deadline: Wed Nov 25, 8:59 PM Pacific"}];
var KEY="cks-pi-v6b-0836:";
function $(id){return document.getElementById(id)}
function toast(m){var t=$("toast");t.textContent=m;t.className="toast on";clearTimeout(t._h);t._h=setTimeout(function(){t.className="toast"},1600)}
function grow(ta){ta.style.height="auto";ta.style.height=(ta.scrollHeight+4)+"px"}
function store(k,v){try{if(v===null)localStorage.removeItem(KEY+k);else localStorage.setItem(KEY+k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(KEY+k)}catch(e){return null}}
function copyText(txt){
  if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(txt).then(function(){toast("Copied")},function(){fallback(txt)})}
  fallback(txt)}
function fallback(txt){var a=document.createElement("textarea");a.value=txt;a.setAttribute("readonly","");a.style.position="fixed";a.style.top="-1000px";document.body.appendChild(a);a.select();a.setSelectionRange(0,txt.length);var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(a);toast(ok?"Copied":"Select and copy manually")}
function update(s){var ta=$("ta-"+s.id),c=$("c-"+s.id),e=$("e-"+s.id),n=ta.value.length;
  if(s.limit){c.textContent=n.toLocaleString()+" / "+s.limit.toLocaleString()+(n>s.limit?" · over by "+(n-s.limit):"");c.className="count"+(n>s.limit?" over":"")}
  else{c.textContent=n.toLocaleString()+" characters";c.className="count nolim"}
  e.textContent=ta.value!==s.text?"edited":"";}
function current(s){return $("ta-"+s.id).value}
function allText(){return SECS.map(function(s){return s.n+". "+s.title+"\n\n"+current(s)}).join("\n\n\n")}
var main=$("main");
SECS.forEach(function(s){
  var d=document.createElement("section");d.className="card";
  d.innerHTML='<h2><span>'+s.n+'</span></h2><textarea id="ta-'+s.id+'" spellcheck="true"></textarea><div class="row"><span class="count" id="c-'+s.id+'"></span><span class="edited" id="e-'+s.id+'"></span><button data-copy="'+s.id+'">Copy</button><button data-reset="'+s.id+'">Reset to final</button></div>';
  d.querySelector("h2").appendChild(document.createTextNode(s.title));
  main.appendChild(d);
  var ta=$("ta-"+s.id);var saved=load(s.id);ta.value=saved!==null?saved:s.text;
  ta.addEventListener("input",function(){store(s.id,ta.value===s.text?null:ta.value);grow(ta);update(s)});
  update(s);
});
function growAll(){SECS.forEach(function(s){grow($("ta-"+s.id))})}
window.addEventListener("load",growAll);window.addEventListener("resize",growAll);setTimeout(growAll,50);
main.addEventListener("click",function(ev){var b=ev.target;
  if(b.getAttribute("data-copy")){var s=SECS.filter(function(x){return x.id===b.getAttribute("data-copy")})[0];copyText(current(s))}
  if(b.getAttribute("data-reset")){var s2=SECS.filter(function(x){return x.id===b.getAttribute("data-reset")})[0];if(confirm("Reset "+s2.title+" to the final text?")){var ta=$("ta-"+s2.id);ta.value=s2.text;store(s2.id,null);grow(ta);update(s2);toast("Reset")}}});
$("copyall").onclick=function(){copyText(allText())};
$("dl").onclick=function(){var b=new Blob([allText()],{type:"text/plain;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="permanent-impermanence-cks.txt";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)};
