:root{--ink:232,228,220;--bg:#000;--glass:rgba(5,6,7,.54);--hair:rgba(232,228,220,.2);--mint:#55DAA1;
 --fold-ease:cubic-bezier(.22,.7,.2,1);--sheet-ease:cubic-bezier(.2,.85,.25,1);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html.red{--bg:#060304;--glass:rgba(6,3,4,.66);--hair:rgba(255,68,87,.34)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:rgb(var(--ink));overflow:hidden;overscroll-behavior:none;
 font:300 13px/1.45 Poppins,sans-serif;letter-spacing:.02em;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
.jul{font-family:"Julius Sans One",Poppins,sans-serif;font-weight:400;letter-spacing:.22em;text-transform:uppercase}
button{font:inherit;color:inherit}
/* top chrome: the Mark, the title, the mint dot */
#top{position:fixed;left:0;right:0;top:0;z-index:30;padding:calc(var(--sat) + 8px) 8px 0;display:flex;align-items:center;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
#mark{flex:none;height:34px;min-width:64px;padding:0 14px;border-radius:16px;border:1px solid var(--hair);background:var(--glass);
 -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:400 15px "Noto Sans Canadian Aboriginal",Poppins,sans-serif;letter-spacing:.06em;
 color:#e8e4dc;cursor:pointer;text-shadow:0 0 6px rgba(255,120,96,.55),0 0 16px rgba(255,90,70,.28);animation:safelight 7s ease-in-out infinite}
html.red #mark{color:#FF4457}
@keyframes safelight{0%,100%{text-shadow:0 0 6px rgba(255,120,96,.5),0 0 16px rgba(255,90,70,.22)}50%{text-shadow:0 0 7px rgba(255,120,96,.7),0 0 20px rgba(255,90,70,.36)}}
#title{flex:1;text-align:center;font:400 9px "Julius Sans One",Poppins,sans-serif;letter-spacing:.32em;color:rgba(var(--ink),.55);text-transform:uppercase;pointer-events:none}
#dot{flex:none;width:44px;height:44px;margin:-5px -5px -5px 0;border:0;background:none;display:grid;place-items:center;cursor:pointer}
#dot span{display:grid;place-items:center;width:32px;height:32px;border-radius:16px;border:1px solid var(--hair);background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#dot i{display:block;width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px rgba(85,218,161,.55)}
/* tabs: full width row, roomy on iPhone */
#tabs{position:fixed;z-index:29;left:0;right:0;top:calc(var(--sat) + 50px);display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
 scroll-snap-type:x proximity;padding:0 18px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent)}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;scroll-snap-align:center;display:flex;align-items:center;gap:6px;background:none;border:0;min-height:40px;padding:0 10px;
 color:rgba(var(--ink),.42);font:400 9px "Julius Sans One",Poppins,sans-serif;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;cursor:pointer;
 box-shadow:inset 0 -1px 0 transparent;transition:color .45s linear,box-shadow .45s linear}
#tabs button.on{color:rgb(var(--ink));box-shadow:inset 0 -1px 0 rgba(var(--ink),.8)}
#tabs button canvas.ico{width:16px;height:16px;flex:none}
#tabs button.tune{color:rgba(var(--ink),.55)}
.ico{transition:transform .5s var(--fold-ease)}
html.ico-mirror .ico{transform:scaleX(-1)}html.ico-flip .ico{transform:scaleY(-1)}html.ico-mirror.ico-flip .ico{transform:scale(-1,-1)}
#track{position:fixed;inset:0;display:flex;will-change:transform}
#track.anim{transition:transform .6s cubic-bezier(.65,0,.35,1)}
.card{position:relative;flex:none;width:100vw;height:100%;overflow:hidden}
.card>canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.lab{position:absolute;left:0;right:0;top:calc(var(--sat) + 94px);padding:4px 22px 6px;touch-action:pan-y;z-index:2;pointer-events:auto}
.lab h2{font:400 12px "Julius Sans One",Poppins,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:rgb(var(--ink))}
.lab h2 .n{font-size:9px;color:rgba(var(--ink),.5);margin-right:10px;letter-spacing:.2em}
.lab p{margin-top:6px;font-size:12px;line-height:1.45;color:rgba(var(--ink),.78);max-width:31em}
html:not(.red) .lab p{color:#c9d3d6}
.fits{display:flex;align-items:center;gap:8px;margin-top:6px}
.fits small{flex:1;font-size:10.5px;line-height:1.35;color:rgba(var(--ink),.6)}
html:not(.red) .fits small{color:#93a1a6}
.fits small b{font:400 8.5px "Julius Sans One",Poppins,sans-serif;letter-spacing:.2em;color:rgba(var(--ink),.7);margin-right:4px}
.inoz{flex:none;min-height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--hair);background:var(--glass);color:rgb(var(--ink));
 font:400 8.5px "Julius Sans One",Poppins,sans-serif;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
/* the value plate: dial A's plate, shared by all nine */
.read{position:absolute;left:50%;bottom:calc(var(--sab) + 14px);z-index:3;min-width:150px;max-width:calc(100vw - 90px);padding:8px 14px 9px;border-radius:12px;
 background:var(--glass);border:1px solid rgba(var(--ink),.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-align:center;pointer-events:none;
 transform-origin:50% 100%;transform:translateX(-50%);opacity:.62;transition:opacity .45s linear,transform .5s var(--fold-ease)}
.read.on{opacity:1}
.read.fold{transition:none;transform:translateX(-50%) perspective(300px) rotateX(-40deg) translateY(4px);opacity:.3}
.read b{display:block;font:400 9px "Julius Sans One",Poppins,sans-serif;letter-spacing:.22em;color:rgba(var(--ink),.55);text-transform:uppercase}
.read span{display:block;margin-top:4px;font:300 17px/1.15 Poppins,sans-serif;letter-spacing:.03em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.read i{display:block;margin-top:4px;font:300 10px/1.35 Poppins,sans-serif;font-style:normal;letter-spacing:.08em;color:rgba(var(--ink),.42)}
.read i:empty{display:none}
.chips{position:absolute;left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:4px;padding:0 50px 0 16px;z-index:3}
.chips button{background:none;border:0;min-height:34px;padding:0 8px;color:rgba(var(--ink),.45);font:400 9px "Julius Sans One",Poppins,sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 -1px 0 transparent}
.chips button.on{color:rgb(var(--ink));box-shadow:inset 0 -1px 0 rgb(var(--ink))}
.chips button canvas{display:block;width:40px;height:26px}
.chips button.thumb{padding:2px 4px}
