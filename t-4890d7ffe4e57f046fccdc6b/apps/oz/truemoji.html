<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>oz · new truemojis and status marks</title>
<style>@font-face{font-family:Julius;src:url(../../fonts/julius-sans-one.woff2)}body{margin:0;background:#04070b;color:#c9d3d6;font:12px Julius,sans-serif;letter-spacing:.16em;text-transform:uppercase;text-align:center}
h1{font-weight:400;font-size:13px;letter-spacing:.3em;margin:22px 0 4px}p{margin:0 0 14px;font-size:10px;color:#7d858f}.g{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding:0 16px 22px}
.c{width:132px;padding:14px 6px;border-radius:18px;background:#0b0f16}.c svg{width:96px;height:96px}.c span{display:block;margin-top:8px;font-size:9.5px}.s .c{background:#f4eee8;color:#3a2a2c}.sm svg{width:28px;height:28px}.c img{object-fit:contain}.sm img{vertical-align:middle}</style></head>
<body><h1>truemoji · the standard pack</h1><p>the pack as it was · hands together, high five, hang loose</p><div class="g" id="o"></div><p>new · in the same 3D emoji style · no red-mode or star-light versions · the images the chat sends</p><div class="g" id="a"></div>
<h1>status marks</h1><p>on a star in the Circle and beside a name in Messages · shown here large, and at their real size</p><div class="g" id="b"></div><div class="g s" id="c"></div>
<script src="../../js/truemoji.js"></script><script>
var T=OZ_TRUEMOJI;function card(k,l){return '<div class="c">'+T.svg(k,96)+'<span>'+(l||T.label(k))+'</span><div class="sm">'+T.svg(k,28)+' '+T.svg(k,17)+'</div></div>'}
function img(src,l){return '<div class="c"><img src="../../'+src+'" width="96" height="96" alt=""><span>'+l+'</span><div class="sm"><img src="../../'+src+'" width="28" height="28" alt=""> <img src="../../'+src+'" width="17" height="17" alt=""></div></div>'}
document.getElementById('o').innerHTML=[['icons/truemoji/hands-3d.png','hands together'],['icons/truemoji/highfive-std.png','high five'],['icons/truemoji/shaka-3d.png','hang loose']].map(function(x){return img(x[0],x[1])}).join('');
document.getElementById('a').innerHTML=[['goodnight','goodnight moon'],['callme','call-me phone'],['goldenhour','golden hour sun'],['dnd','DND red dot'],['hearthands','heart hands'],['clapper','rolling clapperboard'],['paw','walk paw']].map(function(x){return img('icons/truemoji/'+x[0]+'-3d.png',x[1])}).join('');
var S=[['online','online'],['dnd','do not disturb'],['paw','walking'],['clapper','rolling · shooting'],['darkroom','darkroom'],['moon','sleeping']];
document.getElementById('b').innerHTML=S.map(function(s){return card(s[0],s[1])}).join('');document.getElementById('c').innerHTML=S.map(function(s){return card(s[0],s[1]+' · on light')}).join('');
</script></body></html>
