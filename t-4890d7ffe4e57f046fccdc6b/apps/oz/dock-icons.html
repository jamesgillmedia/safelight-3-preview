<!DOCTYPE html><html lang="en"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>oz · dock icons · every mode</title>
<style>@font-face{font-family:Julius;src:url(../../fonts/julius-sans-one.woff2)}body{margin:0;background:#020306;color:#c9d3d6;font:300 12px Julius,sans-serif;letter-spacing:.18em;text-transform:uppercase}
h1{font-weight:400;font-size:13px;letter-spacing:.3em;text-align:center;margin:22px 0 4px}p{text-align:center;margin:0 0 18px;font-size:10px;color:#7d858f}
table{border-collapse:separate;border-spacing:10px;margin:0 auto}th{font-weight:400;font-size:10px;color:#93a1a6}td{width:104px;height:104px;border-radius:22px;text-align:center;vertical-align:middle}
td svg{width:72px;height:72px}.night{background:#04070b}.red{background:#0b0204}.rose{background:#0d0507}.light{background:#F4EEE8}.fullred{background:#060102}th.r{text-align:right;padding-right:8px}</style></head>
<body><h1>oz · dock icons</h1><p>dotted star lines · night · red · rose · light · full red · mint belongs to the dot alone</p><table id="t"></table>
<script src="../../js/dockicons.js"></script><script>
var I=window.OZ_DOCK_ICONS,t=document.getElementById('t'),h='<tr><th></th>'+I.modes.map(function(m){return '<th>'+(m==='fullred'?'full red':m)+'</th>'}).join('')+'</tr>';
I.names.forEach(function(n){h+='<tr><th class="r">'+I.label(n)+'</th>'+I.modes.map(function(m){return '<td class="'+m+'">'+I.svg(n,m)+'</td>'}).join('')+'</tr>'});t.innerHTML=h;
</script></body></html>
